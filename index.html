<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder — Create a Professional Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&family=Roboto:wght@400;500;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg:#f8fafc; --surface:#ffffff; --surface-alt:#f1f5f9;
  --border:#e2e8f0; --text:#0f172a; --text-muted:#64748b;
  --primary:#4f46e5; --primary-hover:#4338ca; --primary-light:#eef2ff;
  --danger:#ef4444; --success:#10b981;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,0.07),0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.08),0 4px 6px -4px rgba(0,0,0,0.04);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,0.1),0 8px 10px -6px rgba(0,0,0,0.05);
  --radius:12px; --radius-sm:8px; --radius-lg:16px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --transition:0.35s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"]{--bg:#f8fafc;--surface:#fff;--surface-alt:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--text-muted:#64748b;--primary:#4f46e5;--primary-hover:#4338ca;--primary-light:#eef2ff;}
[data-theme="ocean"]{--bg:#f0f9ff;--surface:#fff;--surface-alt:#e0f2fe;--border:#bae6fd;--text:#0c4a6e;--text-muted:#0369a1;--primary:#0284c7;--primary-hover:#0369a1;--primary-light:#e0f2fe;}
[data-theme="forest"]{--bg:#f0fdf4;--surface:#fff;--surface-alt:#dcfce7;--border:#bbf7d0;--text:#14532d;--text-muted:#166534;--primary:#16a34a;--primary-hover:#15803d;--primary-light:#dcfce7;}
[data-theme="rose"]{--bg:#fff1f2;--surface:#fff;--surface-alt:#ffe4e6;--border:#fecdd3;--text:#881337;--text-muted:#be123c;--primary:#e11d48;--primary-hover:#be123c;--primary-light:#ffe4e6;}
[data-theme="lavender"]{--bg:#faf5ff;--surface:#fff;--surface-alt:#f3e8ff;--border:#e9d5ff;--text:#4c1d95;--text-muted:#6b21a8;--primary:#9333ea;--primary-hover:#7e22ce;--primary-light:#f3e8ff;}
[data-theme="amber"]{--bg:#fffbeb;--surface:#fff;--surface-alt:#fef3c7;--border:#fde68a;--text:#78350f;--text-muted:#92400e;--primary:#d97706;--primary-hover:#b45309;--primary-light:#fef3c7;}
[data-theme="coral"]{--bg:#fff7ed;--surface:#fff;--surface-alt:#ffedd5;--border:#fed7aa;--text:#7c2d12;--text-muted:#c2410c;--primary:#ea580c;--primary-hover:#c2410c;--primary-light:#ffedd5;}
[data-theme="mint"]{--bg:#f0fdfa;--surface:#fff;--surface-alt:#ccfbf1;--border:#99f6e4;--text:#134e4a;--text-muted:#0f766e;--primary:#14b8a6;--primary-hover:#0d9488;--primary-light:#ccfbf1;}
[data-theme="sky"]{--bg:#f0f9ff;--surface:#fff;--surface-alt:#e0f2fe;--border:#bae6fd;--text:#075985;--text-muted:#0369a1;--primary:#0ea5e9;--primary-hover:#0284c7;--primary-light:#e0f2fe;}
[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--surface-alt:#334155;--border:#475569;--text:#f1f5f9;--text-muted:#94a3b8;--primary:#818cf8;--primary-hover:#6366f1;--primary-light:#1e2a45;}
[data-theme="midnight"]{--bg:#0b1121;--surface:#151e32;--surface-alt:#1e2a45;--border:#2e3d5c;--text:#e2e8f0;--text-muted:#94a3b8;--primary:#818cf8;--primary-hover:#6366f1;--primary-light:#1e2a45;}
[data-theme="sunset"]{--bg:#1a0f0a;--surface:#2d1a12;--surface-alt:#3d2318;--border:#5c3420;--text:#fef3c7;--text-muted:#fbbf24;--primary:#f59e0b;--primary-hover:#d97706;--primary-light:#3d2318;}
[data-theme="slate"]{--bg:#1e293b;--surface:#334155;--surface-alt:#475569;--border:#64748b;--text:#f8fafc;--text-muted:#cbd5e1;--primary:#38bdf8;--primary-hover:#0ea5e9;--primary-light:#475569;}
[data-theme="teal"]{--bg:#042f2e;--surface:#134e4a;--surface-alt:#1f6d68;--border:#2dd4bf;--text:#ccfbf1;--text-muted:#5eead4;--primary:#2dd4bf;--primary-hover:#14b8a6;--primary-light:#1f6d68;}
[data-theme="plum"]{--bg:#1a0f1f;--surface:#2d1a33;--surface-alt:#3d2344;--border:#5c3466;--text:#f3e8ff;--text-muted:#c084fc;--primary:#d946ef;--primary-hover:#c026d3;--primary-light:#3d2344;}
[data-theme="charcoal"]{--bg:#18181b;--surface:#27272a;--surface-alt:#3f3f46;--border:#52525b;--text:#f4f4f5;--text-muted:#a1a1aa;--primary:#fafafa;--primary-hover:#e4e4e7;--primary-light:#3f3f46;}
[data-theme="nebula"]{--bg:#0c0620;--surface:#1a1033;--surface-alt:#251847;--border:#3d2a6b;--text:#e9d5ff;--text-muted:#a78bfa;--primary:#a855f7;--primary-hover:#9333ea;--primary-light:#251847;}
[data-theme="crimson"]{--bg:#1a0606;--surface:#2d0e0e;--surface-alt:#3d1717;--border:#5c2222;--text:#fee2e2;--text-muted:#f87171;--primary:#ef4444;--primary-hover:#dc2626;--primary-light:#3d1717;}
[data-theme="emerald"]{--bg:#022c22;--surface:#064e3b;--surface-alt:#065f46;--border:#10b981;--text:#d1fae5;--text-muted:#6ee7b7;--primary:#34d399;--primary-hover:#10b981;--primary-light:#065f46;}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden;transition:background var(--transition),color var(--transition);}
a{color:var(--primary);text-decoration:none;transition:color .2s;}
a:hover{color:var(--primary-hover);}
button{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:12px 24px;font:inherit;font-weight:600;font-size:.95rem;background:var(--primary);color:#fff;transition:background .2s,transform .15s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
button:hover{background:var(--primary-hover);box-shadow:var(--shadow-md);}
button:active{transform:scale(.97);}
button.secondary{background:var(--surface-alt);color:var(--text);border:1px solid var(--border);}
button.secondary:hover{background:var(--border);}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
button.ghost:hover{background:var(--surface-alt);}
button.danger{background:var(--danger);}
button.danger:hover{background:#dc2626;}
button.small{padding:8px 16px;font-size:.85rem;}
button.lg{padding:16px 36px;font-size:1.05rem;border-radius:var(--radius);}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font:inherit;font-size:.95rem;background:var(--surface);color:var(--text);transition:border-color .2s,box-shadow .2s;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
textarea{min-height:100px;resize:vertical;}
label{display:block;font-size:.78rem;font-weight:700;margin:16px 0 6px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}

.page{opacity:0;transform:translateY(24px);transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1);min-height:100vh;}
.page.active{opacity:1;transform:translateY(0);}
.page.exit{opacity:0;transform:translateY(-16px);pointer-events:none;}
.stagger>*{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease;}
.page.active .stagger>*:nth-child(1){transition-delay:.05s;}
.page.active .stagger>*:nth-child(2){transition-delay:.10s;}
.page.active .stagger>*:nth-child(3){transition-delay:.15s;}
.page.active .stagger>*:nth-child(4){transition-delay:.20s;}
.page.active .stagger>*:nth-child(5){transition-delay:.25s;}
.page.active .stagger>*:nth-child(6){transition-delay:.30s;}
.page.active .stagger>*:nth-child(7){transition-delay:.35s;}
.page.active .stagger>*:nth-child(8){transition-delay:.40s;}
.page.active .stagger>*{opacity:1;transform:translateY(0);}

.header{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 24px;height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;}
.header .logo{font-size:1.2rem;font-weight:800;color:var(--primary);display:flex;align-items:center;gap:10px;cursor:pointer;justify-self:start;}
.header .logo svg{flex-shrink:0;}
.header nav{display:flex;align-items:center;gap:4px;justify-self:center;}
.header nav a{font-size:.88rem;font-weight:600;color:var(--text-muted);padding:8px 14px;border-radius:var(--radius-sm);transition:background .2s,color .2s;}
.header nav a:hover{color:var(--text);background:var(--surface-alt);}
.header nav a.active{color:var(--primary);background:var(--primary-light);}
.header .actions{display:flex;gap:8px;align-items:center;justify-self:end;}
.lang-select{width:auto;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-alt);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;}
.theme-btn{width:40px;height:40px;border-radius:50%;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);padding:0;display:flex;align-items:center;justify-content:center;}
.theme-btn:hover{background:var(--border);color:var(--primary);}
.theme-btn svg{width:20px;height:20px;}

.theme-panel{position:absolute;top:76px;right:24px;width:400px;max-height:calc(100vh - 100px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);padding:20px;z-index:1001;opacity:0;transform:translateY(-10px) scale(.97);pointer-events:none;transition:opacity .25s,transform .25s;}
.theme-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.theme-panel h4{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--primary);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.theme-panel h4::after{content:'';flex:1;height:1px;background:var(--border);}
.theme-panel .section+.section{margin-top:22px;}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.theme-option{background:var(--surface-alt);border:2px solid transparent;border-radius:var(--radius-sm);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .2s;font-size:.78rem;font-weight:600;color:var(--text);text-align:center;}
.theme-option:hover{border-color:var(--border);transform:translateY(-2px);}
.theme-option.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
.theme-option .swatch{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:3px;border:2px solid rgba(0,0,0,.06);}
.theme-option .swatch .d{width:11px;height:11px;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.15);}

.hero{text-align:center;padding:100px 24px 80px;max-width:800px;margin:0 auto;}
.hero .badge{display:inline-block;padding:6px 16px;background:var(--primary-light);color:var(--primary);border-radius:999px;font-size:.82rem;font-weight:700;margin-bottom:24px;letter-spacing:.3px;}
.hero h1{font-size:clamp(2.4rem,5vw,3.6rem);font-weight:800;line-height:1.1;letter-spacing:-.03em;margin-bottom:20px;}
.hero h1 span{color:var(--primary);}
.hero p{font-size:1.15rem;color:var(--text-muted);max-width:620px;margin:0 auto 36px;line-height:1.7;}
.hero .cta-group{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.hero .trust{margin-top:40px;font-size:.85rem;color:var(--text-muted);}
.features{max-width:1100px;margin:0 auto;padding:80px 24px;}
.features h2{text-align:center;font-size:2rem;font-weight:800;margin-bottom:12px;letter-spacing:-.02em;}
.features .subtitle{text-align:center;color:var(--text-muted);margin-bottom:56px;font-size:1.05rem;}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;}
.feature-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 28px;transition:transform .3s,box-shadow .3s,border-color .3s;}
.feature-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary);}
.feature-card .icon{width:48px;height:48px;border-radius:var(--radius);background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:20px;}
.feature-card h3{font-size:1.1rem;font-weight:700;margin-bottom:8px;}
.feature-card p{font-size:.9rem;color:var(--text-muted);line-height:1.6;}
.cta-section{text-align:center;padding:80px 24px 100px;background:var(--surface);border-top:1px solid var(--border);}
.cta-section h2{font-size:2rem;font-weight:800;margin-bottom:12px;}
.cta-section p{color:var(--text-muted);margin-bottom:32px;font-size:1.05rem;}

.templates-page{max-width:1200px;margin:0 auto;padding:60px 32px 100px;}
.templates-page .header-block{text-align:center;margin-bottom:56px;}
.templates-page h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
.templates-page .header-block p{color:var(--text-muted);font-size:1.05rem;max-width:600px;margin:0 auto;}
.templates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;}
.tpl-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;}
.tpl-card:hover{border-color:var(--primary);transform:translateY(-6px);box-shadow:var(--shadow-xl);}
.tpl-card .thumb-wrap{position:relative;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;background:#f1f5f9;margin-bottom:12px;border:1px solid var(--border);}
.tpl-card .thumb-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.tpl-card h3{font-size:.95rem;font-weight:700;}
.tpl-card p{font-size:.78rem;color:var(--text-muted);}
.tpl-card .tpl-badge{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:var(--primary-light);color:var(--primary);}

/* MINI PREVIEWS */
.mini{width:100%;height:100%;background:#fff;position:relative;font-family:'Inter',sans-serif;overflow:hidden;padding:12px 10px;font-size:4px;color:#222;}
.mini .line{height:3px;background:#e5e7eb;border-radius:2px;margin:3px 0;}
.mini .line.s{width:60%;}.mini .line.m{width:80%;}.mini .line.t{width:40%;}
.mini .name{font-size:8px;font-weight:800;margin-bottom:1px;letter-spacing:-.02em;}
.mini .role{font-size:5px;font-weight:600;margin-bottom:3px;}
.mini .contact{font-size:3.5px;color:#888;}
.mini-classic{text-align:center;padding-top:16px;}
.mini-classic .name{font-family:'Playfair Display',serif;font-size:11px;}
.mini-classic .role{color:#2563eb;text-transform:uppercase;letter-spacing:.15em;font-size:4px;}
.mini-classic .hr{height:1px;background:#cbd5e1;margin:6px 12px;}
.mini-classic .section-h{font-size:4px;font-weight:800;letter-spacing:.2em;text-align:left;margin:6px 0 3px;text-transform:uppercase;color:#1e293b;padding-bottom:2px;border-bottom:1px solid #e5e7eb;}
.mini-classic .body{text-align:left;}
.mini-modern{padding:0;display:flex;}
.mini-modern .sb{width:38%;background:#1e40af;color:#fff;padding:10px 8px;}
.mini-modern .sb .name{color:#fff;font-size:8px;line-height:1.1;}
.mini-modern .sb .role{color:rgba(255,255,255,.8);font-size:4px;}
.mini-modern .sb .line{background:rgba(255,255,255,.25);}
.mini-modern .main{flex:1;padding:10px 8px;}
.mini-modern .main .name{font-size:8px;}
.mini-modern .main .role{color:#1e40af;}
.mini-minimal{padding:14px 12px;}
.mini-minimal .name{font-size:10px;font-weight:300;letter-spacing:.05em;text-transform:uppercase;}
.mini-minimal .role{font-size:4px;letter-spacing:.3em;color:#666;text-transform:uppercase;margin-bottom:8px;}
.mini-minimal .section-h{font-size:4px;font-weight:600;letter-spacing:.2em;color:#111;margin:8px 0 3px;text-transform:uppercase;}
.mini-minimal .line{background:#f0f0f0;}
.mini-creative{padding:0;}
.mini-creative .band{background:linear-gradient(135deg,#e11d48,#f59e0b);padding:14px 10px 18px;color:#fff;clip-path:polygon(0 0,100% 0,100% 85%,0 100%);}
.mini-creative .band .name{color:#fff;font-size:10px;}
.mini-creative .band .role{color:rgba(255,255,255,.9);font-size:4px;}
.mini-creative .body{padding:6px 10px 10px;display:flex;gap:8px;}
.mini-creative .col{flex:1;}
.mini-creative .section-h{font-size:4px;color:#e11d48;font-weight:800;letter-spacing:.15em;margin:4px 0 2px;text-transform:uppercase;}
.mini-elegant{background:#fbf7ef;padding:14px 12px;}
.mini-elegant .name{font-family:'Playfair Display',serif;font-size:11px;text-align:center;}
.mini-elegant .role{text-align:center;color:#b45309;font-size:3.5px;letter-spacing:.3em;text-transform:uppercase;}
.mini-elegant .orn{text-align:center;color:#b45309;margin:4px 0;font-size:5px;}
.mini-elegant .section-h{color:#b45309;font-size:4px;letter-spacing:.2em;text-transform:uppercase;margin:6px 0 3px;font-weight:700;}
.mini-elegant .line{background:#e7d9bf;}
.mini-bold{padding:0;}
.mini-bold .top{background:#111;color:#fff;padding:12px 10px;}
.mini-bold .name{color:#fff;font-size:11px;}
.mini-bold .role{color:#dc2626;font-size:4px;font-weight:800;letter-spacing:.15em;}
.mini-bold .body{padding:8px 10px;}
.mini-bold .section-h{color:#111;font-size:5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 3px;padding-left:6px;border-left:3px solid #dc2626;}
.mini-compact{padding:10px;}
.mini-compact .name{font-size:8px;}
.mini-compact .role{color:#059669;font-size:3.5px;}
.mini-compact .two-col{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
.mini-compact .section-h{font-size:3.5px;font-weight:800;letter-spacing:.15em;color:#059669;text-transform:uppercase;margin-bottom:2px;}
.mini-compact .line{background:#d1fae5;height:2px;margin:2px 0;}
.mini-pro{padding:0;}
.mini-pro .strip{height:4px;background:#0891b2;}
.mini-pro .head{padding:10px 12px 6px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #e5e7eb;}
.mini-pro .name{font-size:9px;color:#0f172a;}
.mini-pro .role{color:#0891b2;font-size:4px;font-weight:600;}
.mini-pro .contact{font-size:3.5px;color:#666;text-align:right;}
.mini-pro .body{padding:8px 12px;display:grid;grid-template-columns:2fr 1fr;gap:8px;}
.mini-pro .section-h{font-size:4px;font-weight:800;letter-spacing:.15em;color:#0891b2;text-transform:uppercase;margin:4px 0 2px;}
.mini-two-col{padding:0;display:flex;}
.mini-two-col .left{width:34%;background:#1e40af;color:#fff;padding:10px 7px;}
.mini-two-col .left .name{color:#fff;font-size:7px;line-height:1.1;margin-bottom:4px;}
.mini-two-col .left .role{color:rgba(255,255,255,.75);font-size:3.5px;margin-bottom:8px;}
.mini-two-col .left .section-h{color:#fff;font-size:3.5px;font-weight:800;letter-spacing:.15em;margin:7px 0 2px;text-transform:uppercase;}
.mini-two-col .left .line{background:rgba(255,255,255,.3);height:2px;margin:2px 0;}
.mini-two-col .right{flex:1;padding:10px 8px;}
.mini-two-col .right .section-h{font-size:4px;font-weight:800;letter-spacing:.15em;color:#1e40af;text-transform:uppercase;margin:4px 0 3px;}
.mini-two-col .right .line{background:#dbeafe;}
.mini-timeline{padding:12px 10px;}
.mini-timeline .name{font-size:9px;color:#1e293b;}
.mini-timeline .role{color:#6366f1;font-size:4px;margin-bottom:8px;}
.mini-timeline .tl{position:relative;padding-left:12px;}
.mini-timeline .tl::before{content:'';position:absolute;left:4px;top:3px;bottom:3px;width:1px;background:#c7d2fe;}
.mini-timeline .tl-item{position:relative;margin-bottom:8px;}

.mini-corporate .band .name{color:#fff;font-size:10px;letter-spacing:.06em;}
.mini-corporate .band .role{color:rgba(255,255,255,.85);font-size:3.5px;letter-spacing:.2em;text-transform:uppercase;}
.mini-corporate .body{padding:8px 10px;}
.mini-corporate .section-h{font-size:4px;font-weight:800;letter-spacing:.15em;color:#1e40af;text-transform:uppercase;margin:5px 0 2px;padding-bottom:1px;border-bottom:1px solid #e5e7eb;}
.mini-corporate .line{background:#dbeafe;height:2.5px;margin:2px 0;}
.mini-gradient{padding:0;}

.mini-gradient .top .role{color:rgba(255,255,255,.9);font-size:3.5px;letter-spacing:.15em;}
.mini-gradient .body{padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mini-gradient .section-h{font-size:3.5px;font-weight:800;letter-spacing:.1em;color:#e11d48;text-transform:uppercase;margin-bottom:2px;}
.mini-gradient .line{background:#fce7f3;height:2px;margin:2px 0;}
.mini-magazine{padding:0;}

.mini-magazine .cover .name{font-family:'Playfair Display',serif;font-size:14px;line-height:1;}

.mini-magazine .body{padding:8px 10px;}

.mini-split{padding:0;display:grid;grid-template-columns:1fr 1fr;}

.mini-split .right .line{background:#e2e8f0;height:2.5px;margin:2px 0;}
.mini-metro{padding:0;}

.mini-spotlight .body{padding:8px 12px;}
.mini-spotlight .section-h{font-size:3.5px;font-weight:800;color:#111;letter-spacing:.2em;text-transform:uppercase;margin:5px 0 2px;text-align:center;position:relative;}
.mini-spotlight .section-h::before,.mini-spotlight .section-h::after{content:'';position:absolute;top:50%;width:20%;height:1px;background:#ddd;}
.mini-spotlight .section-h::before{left:0;}

.mini-spotlight .line{background:#e5e7eb;height:2px;margin:2px 0;}

.dashboard{max-width:960px;margin:0 auto;padding:40px 24px 80px;}
.dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:16px;}
.dashboard-header h2{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;}
.resume-list{display:flex;flex-direction:column;gap:16px;}
.resume-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;transition:box-shadow .3s,border-color .3s;}
.resume-item:hover{box-shadow:var(--shadow-md);border-color:var(--primary);}
.resume-item .info{flex:1;}
.resume-item h3{font-size:1.1rem;font-weight:700;margin-bottom:4px;}
.resume-item .meta{font-size:.85rem;color:var(--text-muted);margin-bottom:2px;}
.resume-item .stats{display:flex;gap:16px;margin-top:10px;font-size:.8rem;color:var(--text-muted);flex-wrap:wrap;}
.resume-item .badge{font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:999px;white-space:nowrap;}
.badge.public{background:#dcfce7;color:#166534;}
.badge.private{background:var(--surface-alt);color:var(--text-muted);}
.resume-item .actions{display:flex;gap:8px;flex-wrap:wrap;}

.wizard-layout{display:flex;min-height:calc(100vh - 68px);}
.wizard-sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);padding:32px 24px;flex-shrink:0;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto;}
.wizard-sidebar h3{font-size:1rem;font-weight:700;margin-bottom:4px;}
.wizard-sidebar .resume-title{font-size:.85rem;color:var(--text-muted);margin-bottom:24px;word-break:break-word;}
.step-list{list-style:none;}
.step-item{display:flex;align-items:center;gap:12px;padding:12px 8px;cursor:pointer;color:var(--text-muted);font-weight:500;font-size:.9rem;transition:all .2s;border-radius:var(--radius-sm);}
.step-item:hover{color:var(--text);background:var(--surface-alt);}
.step-item.active{color:var(--primary);font-weight:700;background:var(--primary-light);}
.step-item.completed{color:var(--success);}
.step-number{width:28px;height:28px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;}
.step-item.active .step-number{background:var(--primary);color:#fff;border-color:var(--primary);}
.step-item.completed .step-number{background:var(--success);color:#fff;border-color:var(--success);}
.progress-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--border);}
.progress-section p{font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:8px;}
.progress-bar{height:6px;background:var(--surface-alt);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-hover));border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.progress-text{font-size:.8rem;font-weight:700;color:var(--primary);margin-top:6px;}
.wizard-main{flex:1;padding:48px 56px 80px;max-width:760px;}
.wizard-main h2{font-size:1.8rem;font-weight:800;margin-bottom:8px;letter-spacing:-.02em;}
.wizard-main .step-desc{color:var(--text-muted);margin-bottom:32px;font-size:1rem;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.item-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.item-card strong{display:block;font-size:.95rem;margin-bottom:2px;}
.item-card .meta{font-size:.82rem;color:var(--text-muted);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:.9rem;background:var(--surface-alt);border-radius:var(--radius);border:2px dashed var(--border);}
.wizard-nav{display:flex;justify-content:space-between;margin-top:40px;padding-top:24px;border-top:1px solid var(--border);}
.template-selector{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin:24px 0;}
.template-option{border:2px solid var(--border);border-radius:var(--radius);padding:10px;cursor:pointer;text-align:center;transition:all .25s;background:var(--surface);}
.template-option:hover{border-color:var(--primary);transform:translateY(-3px);}
.template-option.selected{border-color:var(--primary);background:var(--primary-light);}
.template-option .tpl-thumb{aspect-ratio:3/4;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:8px;background:#f1f5f9;border:1px solid var(--border);}
.template-option p{font-size:.8rem;font-weight:600;color:var(--text-muted);}
.resume-preview-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-xl);padding:48px;max-width:800px;margin:24px auto;color:#111;}
.resume-preview-wrap h1{font-size:2rem;font-weight:800;margin-bottom:4px;color:#111;}
.resume-preview-wrap .job-title{font-size:1rem;font-weight:600;color:var(--primary);margin-bottom:8px;}
.resume-preview-wrap .contact{font-size:.85rem;color:#555;margin-bottom:24px;}
.resume-preview-wrap section{margin-top:28px;}
.resume-preview-wrap section h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--primary);border-bottom:2px solid #eee;padding-bottom:6px;margin-bottom:12px;font-weight:800;}
.resume-preview-wrap ul{padding-left:20px;}
.resume-preview-wrap li{margin-bottom:4px;font-size:.9rem;}
.resume-preview-wrap .skill-tag{display:inline-block;padding:3px 12px;margin:3px;background:#e0e7ff;color:#3730a3;border-radius:999px;font-size:.8rem;font-weight:600;}
.resume-preview-wrap .exp-item{margin-bottom:18px;}
.resume-preview-wrap .exp-item strong{font-size:.95rem;}
.resume-preview-wrap .exp-item .meta-line{font-size:.82rem;color:#666;margin-bottom:4px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:10000;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);padding:28px 32px;max-width:560px;width:calc(100vw - 32px);max-height:calc(100vh - 60px);overflow-y:auto;transform:scale(.95);transition:transform .25s;position:relative;}
.modal-overlay.show .modal{transform:scale(1);}
.modal h3{margin:0 0 16px;font-size:1.2rem;}
.modal h4{margin:16px 0 8px;font-size:.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;}
.modal-close{position:absolute;top:12px;right:12px;background:transparent;color:var(--text-muted);padding:6px 10px;font-size:1.2rem;line-height:1;}
.modal-close:hover{background:var(--surface-alt);color:var(--text);}

/* CUSTOMIZER */
.customizer{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.customizer h4{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--primary);margin-bottom:10px;}
.font-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.font-option{background:var(--surface-alt);border:2px solid transparent;border-radius:var(--radius-sm);padding:10px 8px;cursor:pointer;text-align:center;font-size:.85rem;transition:all .2s;color:var(--text);}
.font-option:hover{transform:translateY(-2px);border-color:var(--border);}
.font-option.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
.font-option[data-font="inter"]{font-family:'Inter',sans-serif;}
.font-option[data-font="playfair"]{font-family:'Playfair Display',serif;}
.font-option[data-font="roboto"]{font-family:'Roboto',sans-serif;}
.font-option[data-font="lora"]{font-family:'Lora',serif;}
.font-option[data-font="montserrat"]{font-family:'Montserrat',sans-serif;}
.font-option[data-font="merriweather"]{font-family:'Merriweather',serif;}
.color-grid{display:flex;flex-wrap:wrap;gap:8px;}
.color-option{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .2s,border-color .2s;}
.color-option:hover{transform:scale(1.15);}
.color-option.active{border-color:var(--text);transform:scale(1.15);}
.custom-color{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.8rem;color:var(--text-muted);}
.custom-color input[type="color"]{width:40px;height:32px;padding:0;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:none;}

/* DND */
.dnd-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.dnd-item{display:flex;align-items:center;gap:12px;background:var(--surface-alt);border:2px dashed transparent;border-radius:var(--radius-sm);padding:12px 16px;cursor:grab;transition:all .2s;user-select:none;}
.dnd-item:hover{background:var(--surface);border-color:var(--border);}
.dnd-item.dragging{opacity:.4;cursor:grabbing;border-color:var(--primary);}
.dnd-item.drag-over{border-color:var(--primary);background:var(--primary-light);}
.dnd-handle{color:var(--text-muted);font-size:1.1rem;cursor:grab;line-height:1;letter-spacing:-2px;}
.dnd-label{font-weight:600;flex:1;}
.dnd-hint{font-size:.75rem;color:var(--text-muted);}

/* ANALYTICS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center;}
.stat-card .stat-value{font-size:1.8rem;font-weight:800;color:var(--primary);line-height:1.1;}
.stat-card .stat-label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-top:4px;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 0;margin-bottom:16px;border-bottom:1px solid var(--border);}
.bar-chart .bar{flex:1;min-height:2px;background:var(--primary);border-radius:4px 4px 0 0;position:relative;transition:height .4s;}
.bar-chart .bar:hover{background:var(--primary-hover);}
.bar-chart .bar-label{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--text-muted);white-space:nowrap;}

/* QR */
.qr-preview{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;background:var(--surface-alt);border-radius:var(--radius);border:1px solid var(--border);}
.qr-preview canvas,.qr-preview img{background:#fff;padding:8px;border-radius:8px;}
.qr-url{font-family:monospace;font-size:.75rem;color:var(--text-muted);word-break:break-all;text-align:center;max-width:240px;}

/* RECRUITER */
.recruiter-header{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:20px;background:var(--primary-light);color:var(--primary);border-radius:var(--radius);font-weight:600;font-size:.9rem;}
.recruiter-badge{display:inline-block;padding:3px 10px;background:var(--primary);color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.share-list{display:flex;flex-direction:column;gap:10px;}
.share-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.85rem;}

/* RESUME FONT CLASSES */
.resume-preview-wrap.font-inter{font-family:'Inter',system-ui,sans-serif;}
.resume-preview-wrap.font-playfair{font-family:'Playfair Display',serif;}
.resume-preview-wrap.font-roboto{font-family:'Roboto',sans-serif;}
.resume-preview-wrap.font-lora{font-family:'Lora',serif;}
.resume-preview-wrap.font-montserrat{font-family:'Montserrat',sans-serif;}
.resume-preview-wrap.font-merriweather{font-family:'Merriweather',serif;}

.pdf-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;}
.pdf-overlay.show{opacity:1;pointer-events:auto;}
.pdf-spinner{background:var(--surface);border-radius:var(--radius-lg);padding:28px 40px;box-shadow:var(--shadow-xl);display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:600;color:var(--text);}
.pdf-spinner .ring{width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.container{max-width:1100px;margin:0 auto;padding:0 24px;}
.hidden{display:none!important;}
.mt-1{margin-top:8px;}.mt-2{margin-top:16px;}.mt-3{margin-top:24px;}
.mb-2{margin-bottom:16px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.muted{color:var(--text-muted);font-size:.85rem;}

@media(max-width:900px){
  .wizard-layout{flex-direction:column;}
  .wizard-sidebar{width:100%;position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);padding:24px;}
  .wizard-main{padding:32px 24px 60px;max-width:100%;}
  .form-grid{grid-template-columns:1fr;}
  .theme-panel{width:calc(100vw - 32px);right:16px;}
  .theme-grid{grid-template-columns:repeat(2,1fr);}
  .customizer{grid-template-columns:1fr;}
}
@media(max-width:720px){
  .header{grid-template-columns:auto 1fr auto;padding:0 12px;gap:6px;}
  .header nav{display:none;}
  .hero{padding:60px 16px 50px;}
  .resume-item{flex-direction:column;}
  .templates-page{padding:40px 16px 80px;}
  .resume-preview-wrap{padding:24px;}
}

@media print{
  @page{margin:1cm;size:A4 portrait;}
  html,body{background:#fff!important;color:#111!important;margin:0!important;padding:0!important;}

function renderThemePanel() {
  const light = $('light-themes'), dark = $('dark-themes');
  if (!light || !dark) return;
  const one = (th) => `

        <span class="d" style="background:#f59e0b"></span>
      </span>
      <span>${th.name}</span>

  light.innerHTML = LIGHT_THEMES.map(one).join('');
  dark.innerHTML = DARK_THEMES.map(one).join('');
}
function toggleThemePanel(e) { e.stopPropagation(); $('theme-panel').classList.toggle('open'); }

function navigate(page, params = {}) {
  const app = $('app');
  const current = app.querySelector('.page');
  state.page = page;
  updateNavActive(page);
  if (current) { current.classList.add('exit'); setTimeout(() => { current.remove(); renderPage(page, params); }, 300); }
  else renderPage(page, params);
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function updateNavActive(page) {
  document.querySelectorAll('#main-nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === page));
  const cta = $('header-cta');
  if (cta) {
    if (page === 'wizard' || page === 'preview') {
      cta.textContent = '← ' + t('templates'); cta.onclick = () => navigate('templates');
    } else {
      cta.textContent = t('myResumes'); cta.onclick = () => navigate('dashboard');
    }
  }
}
function renderPage(page, params) {
  const app = $('app');
  let html = '';
  switch (page) {
    case 'landing': html = renderLanding(); break;
    case 'templates': html = renderTemplatesPage(); break;
    case 'dashboard': html = renderDashboard(); break;
    case 'wizard': html = renderWizard(params.id); break;
    case 'preview': html = renderPreview(params.id); break;
    case 'recruiter': html = renderRecruiterPage(); break;
    case 'auth': html = renderAuthPage(); break;
    default: html = renderLanding();
  }
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  const pageEl = wrap.firstElementChild;
  if (pageEl) app.appendChild(pageEl);
  requestAnimationFrame(() => requestAnimationFrame(() => pageEl && pageEl.classList.add('active')));
  if (page === 'wizard') setTimeout(attachDnD, 50);
}

          <div class="feature-card"><div class="icon">🔀</div><h3>Reorder Sections</h3><p>Drag and drop to reorder resume sections.</p></div>
          <div class="feature-card"><div class="icon">🌍</div><h3>Multi-language</h3><p>English, Spanish, and Hindi out of the box.</p></div>

        <h2>Ready to Build Your Resume?</h2>

}

   TEMPLATES
   ============================================================ */
function renderTemplatesPage() {
  return `
    <div class="page">
      <div class="templates-page">
        <div class="header-block stagger">
          <h1>Choose a Template</h1>
          <p>20 professionally designed templates. All ATS-friendly.</p>

}

function useTemplate(tplId) {
  const id = generateId();
  const newResume = {
    id, title: 'Untitled Resume', template: tplId, isPublic: false,
    full_name:'', job_title:'', email:'', phone:'', location:'', website:'',
    summary:'', portfolio_url:'',
    font:'inter', accent_color:'',
    section_order: JSON.stringify(['summary','experience','education','skills']),
    experiences: [], educations: [], skills: [], projects: [],
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
  };
  state.resumes.unshift(newResume);
  saveResumes();
  state.currentResumeId = id;
  state.wizardStep = 0;
  navigate('wizard', { id });
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard() {
  const resumes = state.resumes;
  const isRecruiter = state.user && state.user.role === 'recruiter';
  return `
    <div class="page">
      <div class="dashboard">
        ${isRecruiter ? `<div class="recruiter-header"><span class="recruiter-badge">Recruiter</span><span>${t('inboxTitle')}: ${state.shares.filter(s=>s.shared_with === state.user.email).length} shared</span></div>` : ''}
        <div class="dashboard-header stagger">
          <div>
            <h2>${t('myResumes')}</h2>
            <p style="color:var(--text-muted);font-size:.9rem;margin-top:4px;">${resumes.length} resume${resumes.length !== 1 ? 's' : ''} saved</p>
          </div>
          <div style="display:flex;gap:8px;">
            ${!state.user ? `<button class="secondary" onclick="navigate('auth')">${t('login')} / ${t('register')}</button>` : `<button class="secondary" onclick="logout()">${t('logout')}</button>`}
            <button onclick="navigate('templates')">${t('newResume')}</button>
          </div>
        </div>
        <div class="resume-list stagger">
          ${resumes.length === 0 ? `
            <div class="empty-state">
              <div style="font-size:2.4rem;margin-bottom:12px;">📄</div>
              <h3 style="margin-bottom:8px;font-weight:700;">${t('noResumes')}</h3>
              <br><button onclick="navigate('templates')">${t('browseTemplates')}</button>
            </div>` :
            resumes.map(r => renderResumeItem(r)).join('')}
        </div>
      </div>
    </div>`;
}

function renderResumeItem(r) {
  const sectionCount = (r.experiences?.length || 0) + (r.educations?.length || 0) + (r.skills?.length || 0);
  const views = state.analytics[r.id]?.views?.length || 0;
  return `
    <div class="resume-item">
      <div class="info">
        <h3>${esc(r.title)}</h3>
        <p class="meta">${esc(r.full_name || 'No name yet')}${r.job_title ? ' · ' + esc(r.job_title) : ''}</p>
        <div class="stats">
          <span>📋 ${sectionCount} sections</span>
          <span>👁️ ${views} ${t('views')}</span>
          <span>🎨 ${r.template}</span>
          <span>Updated ${formatDate(r.updatedAt)}</span>
        </div>
      </div>
      <span class="badge ${r.isPublic ? 'public' : 'private'}">${r.isPublic ? 'Public' : 'Private'}</span>
      <div class="actions">
        <button class="small" onclick="editResume('${r.id}')">${t('edit')}</button>
        <button class="small secondary" onclick="previewResume('${r.id}')">${t('preview')}</button>
        <button class="small secondary" onclick="showAnalytics('${r.id}')">${t('analytics')}</button>
        <button class="small secondary" onclick="togglePublic('${r.id}')">${r.isPublic ? t('makePrivate') : t('publish')}</button>
        <button class="small danger" onclick="deleteResume('${r.id}')">${t('delete')}</button>
      </div>
    </div>`;
}
function formatDate(iso) {
  if (!iso) return 'just now';
  const d = new Date(iso);
  const diff = Math.floor((new Date() - d) / 60000);
  if (diff < 1) return 'just now';
  if (diff < 60) return `${diff}m ago`;
  if (diff < 1440) return `${Math.floor(diff/60)}h ago`;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function editResume(id) { state.currentResumeId = id; state.wizardStep = 0; navigate('wizard', { id }); }
function deleteResume(id) {
  if (!confirm('Delete this resume?')) return;
  state.resumes = state.resumes.filter(r => r.id !== id);
  state.shares = state.shares.filter(s => s.resume_id !== id);
  delete state.analytics[id];
  saveResumes(); saveShares(); saveAnalytics();
  navigate('dashboard');
}
function togglePublic(id) {
  const r = state.resumes.find(x => x.id === id); if (!r) return;
  r.isPublic = !r.isPublic;
  r.updatedAt = new Date().toISOString();
  saveResumes(); navigate('dashboard');
}
function previewResume(id) {
  state.currentResumeId = id;
  // log a view
  logView(id);
  navigate('preview', { id });
}
function logView(id) {
  if (!state.analytics[id]) state.analytics[id] = { views: [] };
  state.analytics[id].views.push({ at: new Date().toISOString(), referrer: document.referrer || 'direct' });
  saveAnalytics();
}

/* ============================================================
   AUTH
   ============================================================ */
function renderAuthPage() {
  return `
    <div class="page">
      <div class="container" style="max-width:460px;margin-top:60px;">
        <div class="card" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-md);">
          <h2 style="margin-bottom:20px;">${t('registerTitle')}</h2>
          <div id="auth-error" class="error-box hidden" style="background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-bottom:12px;"></div>
          <form onsubmit="event.preventDefault();doAuthRegister()">
            <label>${t('fullName')}</label><input id="r-name" required>
            <label>${t('email')}</label><input id="r-email" type="email" required>
            <label>${t('password')}</label><input id="r-password" type="password" minlength="6" required>
            <label>${t('role')}</label>
            <select id="r-role">
              <option value="user">${t('jobSeeker')}</option>
              <option value="recruiter">${t('recruiterRole')}</option>
            </select>
            <div style="margin-top:20px;display:flex;gap:8px;">
              <button type="submit" style="flex:1;">${t('register')}</button>
              <button type="button" class="secondary" onclick="navigate('landing')">${t('cancel')}</button>
            </div>
          </form>
        </div>
      </div>
    </div>`;
}
function doAuthRegister() {
  const name = $('r-name').value.trim();
  const email = $('r-email').value.trim().toLowerCase();
  const password = $('r-password').value;
  const role = $('r-role').value;
  if (!name || !email || !password) return showAuthError('All fields required');
  state.user = { id: generateId(), name, email, role, password };
  saveUser();
  applyRoleUI();
  navigate('dashboard');
}
function showAuthError(msg) {
  const el = $('auth-error');
  if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}
function applyRoleUI() {
  const isRecruiter = state.user && state.user.role === 'recruiter';
  const nav = $('nav-recruiter');
  if (nav) nav.style.display = isRecruiter ? '' : 'none';
}
function logout() {
  state.user = null; localStorage.removeItem('user');
  applyRoleUI(); navigate('landing');
}

/* ============================================================
   WIZARD
   ============================================================ */
function renderWizard(id) {
  state.currentResumeId = id;
  const r = getCurrentResume();
  if (!r) { navigate('dashboard'); return ''; }
  const step = WIZARD_STEPS[state.wizardStep];
  const percent = getCompletion(r);
  return `
    <div class="page">
      <div class="wizard-layout">
        <aside class="wizard-sidebar">
          <h3>📄 ${esc(r.title)}</h3>
          <p class="resume-title">Complete all steps</p>
          <ul class="step-list">
            ${WIZARD_STEPS.map((s,i) => `
              <li class="step-item ${i === state.wizardStep ? 'active' : ''} ${i < state.wizardStep ? 'completed' : ''}" onclick="goToStep(${i})">
                <span class="step-number">${i < state.wizardStep ? '✓' : s.icon}</span>
                <span>${t(s.label)}</span>
              </li>`).join('')}
          </ul>
          <div class="progress-section">
            <p>Resume Completeness</p>
            <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
            <div class="progress-text">${percent}% complete</div>
          </div>
        </aside>
        <main class="wizard-main">
          <div id="step-content">${renderStepContent(step.key, r)}</div>
          <div class="wizard-nav">
            <button class="secondary" onclick="prevStep()" ${state.wizardStep === 0 ? 'disabled' : ''}>${t('back')}</button>
            <button onclick="nextStep()">${state.wizardStep === WIZARD_STEPS.length - 1 ? t('finish') : t('next')}</button>
          </div>
        </main>
      </div>
    </div>`;
}
function getCompletion(r) {
  const checks = [!!r.full_name, !!r.job_title, !!r.email,
    (r.experiences?.length||0) > 0, (r.educations?.length||0) > 0,
    (r.skills?.length||0) > 0, !!r.summary];
  return Math.round((checks.filter(Boolean).length / checks.length) * 100);
}
function renderStepContent(key, r) {
  switch (key) {
    case 'heading': return stepHeading(r);
    case 'work': return stepWork(r);
    case 'education': return stepEducation(r);
    case 'skills': return stepSkills(r);
    case 'summary': return stepSummary(r);
    case 'finalize': return stepFinalize(r);
    default: return '';
  }
}
function saveCurrentStep() {
  const r = getCurrentResume(); if (!r) return;
  const stepKey = WIZARD_STEPS[state.wizardStep]?.key;
  if (stepKey === 'heading') {
    ['full_name','job_title','email','phone','location','website','portfolio_url'].forEach(f => {
      const el = $('h-' + f); if (el) r[f] = el.value;
    });
  } else if (stepKey === 'summary') {
    const el = $('s-summary'); if (el) r.summary = el.value;
  }
  r.updatedAt = new Date().toISOString(); saveResumes();
}
function goToStep(i) { saveCurrentStep(); state.wizardStep = i; navigate('wizard', { id: state.currentResumeId }); }
function nextStep() {
  saveCurrentStep();
  if (state.wizardStep < WIZARD_STEPS.length - 1) { state.wizardStep++; navigate('wizard', { id: state.currentResumeId }); }
  else navigate('preview', { id: state.currentResumeId });
}
function prevStep() {
  saveCurrentStep();
  if (state.wizardStep > 0) { state.wizardStep--; navigate('wizard', { id: state.currentResumeId }); }
}

/* Step 1 */
function stepHeading(r) {
  const f = (id, label, ph, type='text') => `
    <div><label>${label}</label>
    <input id="h-${id}" type="${type}" value="${esc(r[id] || '')}" placeholder="${ph}"
           oninput="debouncedHeading()"></div>`;
  return `
    <h2>${t('heading')}</h2>
    <p class="step-desc">Your basic info.</p>
    <div class="form-grid">
      ${f('full_name','Full Name','John Doe')}
      ${f('job_title','Job Title','Software Engineer')}
      ${f('email','Email','john@example.com','email')}
      ${f('phone','Phone','+1 234 567 890')}
      ${f('location','Location','New York')}
      ${f('website','Website','portfolio.com')}
      ${f('portfolio_url', t('portfolioLink'),'https://github.com/johndoe')}
    </div>`;
}
let headingTimer;
function debouncedHeading() {
  clearTimeout(headingTimer);
  headingTimer = setTimeout(() => {
    const r = getCurrentResume(); if (!r) return;
    ['full_name','job_title','email','phone','location','website','portfolio_url'].forEach(f => {
      const el = $('h-' + f); if (el) r[f] = el.value;
    });
    r.updatedAt = new Date().toISOString(); saveResumes();
    updateProgressBar(r);
  }, 400);
}
function updateProgressBar(r) {
  const pct = getCompletion(r);
  const fill = document.querySelector('.progress-fill');
  const txt = document.querySelector('.progress-text');
  if (fill) fill.style.width = pct + '%';
  if (txt) txt.textContent = pct + '% complete';
}

/* Step 2 */
function stepWork(r) {
  const items = r.experiences || [];
  return `
    <h2>${t('work')}</h2>
    <div>${items.length === 0 ? '<div class="empty-state">No experience yet</div>' :
      items.map(e => `
        <div class="item-card">
          <div><strong>${esc(e.role||'Role')} @ ${esc(e.company)}</strong>
            <div class="meta">${esc([e.location, [e.startDate,e.endDate].filter(Boolean).join(' – ')].filter(Boolean).join(' · '))}</div>
          </div>
          <button class="small danger" onclick="delExperience('${e.id}')">${t('delete')}</button>
        </div>`).join('')}
    </div>
    <div style="margin-top:24px;">
      <h3>Add</h3>
      <form onsubmit="event.preventDefault();addExperience()">
        <div class="form-grid">
          <div><label>Company *</label><input id="w-company" required></div>
          <div><label>Role</label><input id="w-role"></div>
          <div><label>Location</label><input id="w-location"></div>
          <div><label>Start</label><input id="w-startDate" placeholder="Jan 2023"></div>
          <div><label>End</label><input id="w-endDate" placeholder="Present"></div>
        </div>
        <label>Description</label>
        <textarea id="w-description" rows="4"></textarea>
        <div class="mt-2"><button class="small" type="submit">${t('addExperience')}</button></div>
      </form>
    </div>`;
}
function addExperience() {
  const r = getCurrentResume(); if (!r) return;
  r.experiences = r.experiences || [];
  r.experiences.push({
    id: generateId(),
    company: $('w-company').value, role: $('w-role').value,
    location: $('w-location').value, startDate: $('w-startDate').value,
    endDate: $('w-endDate').value, description: $('w-description').value,
  });
  r.updatedAt = new Date().toISOString(); saveResumes();
  navigate('wizard', { id: r.id });
}
function delExperience(id) {
  const r = getCurrentResume(); if (!r) return;
  r.experiences = r.experiences.filter(x => x.id !== id);
  r.updatedAt = new Date().toISOString(); saveResumes();
  navigate('wizard', { id: r.id });
}

/* Step 3 */
function stepEducation(r) {
  const items = r.educations || [];
  return `
    <h2>${t('education')}</h2>
    <div>${items.length === 0 ? '<div class="empty-state">No education yet</div>' :
      items.map(e => `
        <div class="item-card">
          <div><strong>${esc(e.institution)}</strong>
            <div class="meta">${esc([e.degree,e.fieldOfStudy].filter(Boolean).join(', '))}</div>
            <div class="meta">${esc([e.startYear,e.endYear].filter(Boolean).join(' – '))}</div>
          </div>
          <button class="small danger" onclick="delEducation('${e.id}')">${t('delete')}</button>
        </div>`).join('')}
    </div>
    <div style="margin-top:24px;">
      <h3>Add</h3>
      <form onsubmit="event.preventDefault();addEducation()">
        <div class="form-grid">
          <div><label>Institution *</label><input id="e-institution" required></div>
          <div><label>Degree</label><input id="e-degree"></div>
          <div><label>Field</label><input id="e-fieldOfStudy"></div>
          <div><label>Start Year</label><input id="e-startYear"></div>
          <div><label>End Year</label><input id="e-endYear"></div>
          <div><label>Grade</label><input id="e-grade"></div>
        </div>
        <div class="mt-2"><button class="small" type="submit">${t('addEducation')}</button></div>
      </form>
    </div>`;
}
function addEducation() {
  const r = getCurrentResume(); if (!r) return;
  r.educations = r.educations || [];
  r.educations.push({
    id: generateId(),
    institution: $('e-institution').value, degree: $('e-degree').value,
    fieldOfStudy: $('e-fieldOfStudy').value, startYear: $('e-startYear').value,
    endYear: $('e-endYear').value, grade: $('e-grade').value,
  });
  r.updatedAt = new Date().toISOString(); saveResumes();
  navigate('wizard', { id: r.id });
}
function delEducation(id) {
  const r = getCurrentResume(); if (!r) return;
  r.educations = r.educations.filter(x => x.id !== id);
  r.updatedAt = new Date().toISOString(); saveResumes();
  navigate('wizard', { id: r.id });
}

/* Step 4 */
function stepSkills(r) {
  const items = r.skills || [];
  return `
    <h2>${t('skills')}</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;">
      ${items.length === 0 ? '<div class="empty-state" style="width:100%">No skills yet</div>' :
        items.map(s => `
          <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--primary-light);color:var(--primary);border-radius:999px;font-weight:600;font-size:.85rem;">
            ${esc(s.name)}

      <div style="flex:2;min-width:200px;"><label>Skill *</label><input id="s-name" required></div>
      <div style="flex:1;min-width:120px;"><label>Level</label><input id="s-level" type="number" min="1" max="5" value="3"></div>
      <div><button class="small" type="submit">${t('addSkill')}</button></div>
    </form>`;
}
function addSkill() {
  const r = getCurrentResume(); if (!r) return;
  r.skills = r.skills || [];
  r.skills.push({ id: generateId(), name: $('s-name').value, level: Number($('s-level').value) || 3 });
  r.updatedAt = new Date().toISOString(); saveResumes();
  navigate('wizard', { id: r.id });
}
function delSkill(id) {
  const r = getCurrentResume(); if (!r) return;
  r.skills = r.skills.filter(x => x.id !== id);
  r.updatedAt = new Date().toISOString(); saveResumes();
  navigate('wizard', { id: r.id });
}

/* Step 5 */
function stepSummary(r) {
  return `
    <h2>${t('summary')}</h2>
    <p class="step-desc">A short professional summary.</p>
    <textarea id="s-summary" rows="7" oninput="debouncedSummary()" placeholder="Motivated software developer...">${esc(r.summary || '')}</textarea>`;
}
let summaryTimer;
function debouncedSummary() {
  clearTimeout(summaryTimer);
  summaryTimer = setTimeout(() => {
    const r = getCurrentResume(); if (!r) return;
    const el = $('s-summary'); if (!el) return;
    r.summary = el.value; r.updatedAt = new Date().toISOString(); saveResumes();

        </div>
      </div>
    </div>

    <h3 style="font-size:1rem;margin:28px 0 10px;">${t('sectionOrder')}</h3>
    <p class="dnd-hint">${t('dragToReorder')}</p>
    <div class="dnd-list" id="dnd-list">
      ${order.map(k => dndItemHTML(k)).join('')}
    </div>

    <h3 style="font-size:1rem;margin:28px 0 10px;">${t('previewLabel')}</h3>
    <div class="resume-preview-wrap font-${r.font || 'inter'}" id="resume-preview" style="${r.accent_color ? '--accent:'+r.accent_color : ''}">
      ${buildResumeHTML(r)}

    <div class="mt-3" style="display:flex;gap:12px;flex-wrap:wrap;">
      <button onclick="exportPDF()">${t('downloadPdf')}</button>
      <button class="secondary" onclick="printResume()">${t('print')}</button>
      <button class="secondary" onclick="showQR()">${t('qr')}</button>
      <button class="secondary" onclick="showShareModal()">${t('share')}</button>
      <button class="secondary" onclick="showAnalytics('${r.id}')">${t('analytics')}</button>
      <button class="secondary" onclick="togglePublicFromWizard()">${r.isPublic ? '🔒 ' + t('makePrivate') : '🌐 ' + t('publish')}</button>
    </div>`;
}

/* Section order */
function safeOrder(json) {
  try {
    const a = JSON.parse(json);
    if (Array.isArray(a) && a.length) return a.filter(k => SECTION_KEYS.includes(k));
  } catch {}
  return ['summary','experience','education','skills'];
}
function dndItemHTML(key) {
  const labels = { summary:t('summary'), experience:t('work'), education:t('education'), skills:t('skills'), projects:'Projects' };
  return `
    <div class="dnd-item" draggable="true" data-key="${key}">
      <span class="dnd-handle">⋮⋮</span>
      <span class="dnd-label">${labels[key] || key}</span>
    </div>`;
}
function attachDnD() {
  const list = $('dnd-list'); if (!list) return;
  let dragEl = null;
  list.querySelectorAll('.dnd-item').forEach(item => {
    item.addEventListener('dragstart', () => { dragEl = item; item.classList.add('dragging'); });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      list.querySelectorAll('.dnd-item').forEach(i => i.classList.remove('drag-over'));
      saveSectionOrder();
    });
    item.addEventListener('dragover', (e) => { e.preventDefault(); if (item !== dragEl) item.classList.add('drag-over'); });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', (e) => {
      e.preventDefault(); item.classList.remove('drag-over');
      if (!dragEl || item === dragEl) return;
      const items = [...list.querySelectorAll('.dnd-item')];
      const from = items.indexOf(dragEl), to = items.indexOf(item);
      if (from < to) item.after(dragEl); else item.before(dragEl);
    });
  });
}
function saveSectionOrder() {
  const r = getCurrentResume(); if (!r) return;
  const order = [...document.querySelectorAll('#dnd-list .dnd-item')].map(i => i.dataset.key);
  r.section_order = JSON.stringify(order);
  r.updatedAt = new Date().toISOString(); saveResumes();
  const prev = $('resume-preview');
  if (prev) prev.innerHTML = buildResumeHTML(r);
}

function selectTemplate(id) {
  const r = getCurrentResume(); if (!r) return;
  r.template = id; r.updatedAt = new Date().toISOString(); saveResumes();
  navigate('wizard', { id: r.id });
}
function selectFont(id) {
  const r = getCurrentResume(); if (!r) return;
  r.font = id; r.updatedAt = new Date().toISOString(); saveResumes();
  const prev = $('resume-preview');
  if (prev) { FONTS.forEach(f => prev.classList.remove('font-' + f.id)); prev.classList.add('font-' + id); }
  document.querySelectorAll('.font-option').forEach(el => el.classList.toggle('active', el.dataset.font === id));
}
function selectColor(color) {
  const r = getCurrentResume(); if (!r) return;
  r.accent_color = color; r.updatedAt = new Date().toISOString(); saveResumes();
  const prev = $('resume-preview');
  if (prev) { prev.style.setProperty('--accent', color); prev.innerHTML = buildResumeHTML(r); }
  document.querySelectorAll('.color-option').forEach(el => {
    const bg = el.style.background || el.style.backgroundColor;
    el.classList.toggle('active', bg === color || rgbFromHex(bg) === color);
  });
}
function rgbFromHex(hex) {
  const d = document.createElement('div'); d.style.color = hex; document.body.appendChild(d);
  const rgb = getComputedStyle(d).color;
  document.body.removeChild(d);
  return rgb;
}
function togglePublicFromWizard() {
  const r = getCurrentResume(); if (!r) return;
  r.isPublic = !r.isPublic; r.updatedAt = new Date().toISOString(); saveResumes();
  navigate('wizard', { id: r.id });
}

/* ============================================================
   BUILD RESUME HTML — respects order, font, accent color
   ============================================================ */
function buildResumeHTML(r) {
  const accent = r.accent_color || 'var(--primary)';
  const contact = [r.email, r.phone, r.location, r.website].filter(Boolean).map(esc).join(' • ');
  const order = safeOrder(r.section_order);

  const expHTML = (r.experiences || []).map(e => `
    <div class="exp-item">
      <strong>${esc(e.role || '')}${e.role && e.company ? ' — ' : ''}${esc(e.company)}</strong>
      <div class="meta-line">${esc([e.location, [e.startDate,e.endDate].filter(Boolean).join(' – ')].filter(Boolean).join(' · '))}</div>
      ${e.description ? '<ul>' + e.description.split('\n').filter(Boolean).map(l => `<li>${esc(l.replace(/^[•\-\s]+/,''))}</li>`).join('') + '</ul>' : ''}
    </div>`).join('');

  const eduHTML = (r.educations || []).map(e => `
    <div style="margin-bottom:12px;">
      <strong>${esc(e.institution)}</strong>
      <div class="meta-line">${esc([e.degree,e.fieldOfStudy].filter(Boolean).join(', '))}</div>
      <div class="meta-line">${esc([e.startYear,e.endYear].filter(Boolean).join(' – '))}${e.grade ? ' · ' + esc(e.grade) : ''}</div>
    </div>`).join('');

  const skillsHTML = (r.skills || []).map(s => `<span class="skill-tag" style="background:${accent}22;color:${accent};">${esc(s.name)}</span>`).join('');

  const summaryHTML = r.summary ? `<section><h2 style="color:${accent};border-bottom-color:#eee;">${t('summary')}</h2><p>${esc(r.summary)}</p></section>` : '';
  const expSection = expHTML ? `<section><h2 style="color:${accent};border-bottom-color:#eee;">${t('work')}</h2>${expHTML}</section>` : '';
  const eduSection = eduHTML ? `<section><h2 style="color:${accent};border-bottom-color:#eee;">${t('education')}</h2>${eduHTML}</section>` : '';
  const sklSection = skillsHTML ? `<section><h2 style="color:${accent};border-bottom-color:#eee;">${t('skills')}</h2><div>${skillsHTML}</div></section>` : '';

  const map = { summary:summaryHTML, experience:expSection, education:eduSection, skills:sklSection };
  return `
    <h1>${esc(r.full_name || r.title)}</h1>
    ${r.job_title ? `<div class="job-title" style="color:${accent}">${esc(r.job_title)}</div>` : ''}
    <div class="contact">${contact}</div>
    ${order.map(k => map[k] || '').join('')}
  `;
}

/* ============================================================
   PDF EXPORT
   ============================================================ */
async function exportPDF() {
  const preview = document.querySelector('.resume-preview-wrap');
  if (!preview) return alert('No preview found.');
  if (typeof html2pdf === 'undefined') return alert('PDF library loading, retry in a sec.');
  $('pdf-overlay').classList.add('show');
  const prevTheme = document.documentElement.getAttribute('data-theme') || state.theme;
  document.documentElement.setAttribute('data-theme', 'light');
  const orig = { boxShadow:preview.style.boxShadow, borderRadius:preview.style.borderRadius, margin:preview.style.margin, maxWidth:preview.style.maxWidth };
  preview.style.boxShadow = 'none'; preview.style.borderRadius = '0'; preview.style.margin = '0 auto'; preview.style.maxWidth = '800px';
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch {} }
  await new Promise(r => setTimeout(r, 120));
  const r = getCurrentResume() || {};
  const baseName = (r.full_name || r.title || 'resume').toString().trim().replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'') || 'resume';
  try {
    await html2pdf().set({
      margin:[10,10,10,10], filename:`${baseName}.pdf`, image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,windowWidth:document.documentElement.scrollWidth,width:preview.scrollWidth,height:preview.scrollHeight},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}, pagebreak:{mode:['css','legacy']},
    }).from(preview).save();
  } catch (err) { console.error(err); alert('PDF failed.'); }
  finally {
    preview.style.boxShadow = orig.boxShadow; preview.style.borderRadius = orig.borderRadius;
    preview.style.margin = orig.margin; preview.style.maxWidth = orig.maxWidth;
    document.documentElement.setAttribute('data-theme', prevTheme);
    $('pdf-overlay').classList.remove('show');
  }
}

/* ============================================================

function showShareModal() {
  const r = getCurrentResume(); if (!r) return;
  openModal(`
    <h3>${t('shareTitle')}</h3>
    <p class="muted">${t('shareDesc')}</p>

    <div id="share-existing"></div>
  `);
  const existing = state.shares.filter(s => s.resume_id === r.id);
  if (existing.length) {
    const el = $('share-existing');
    if (el) el.innerHTML = `<h4>Already shared with</h4>
      <div class="share-list">${existing.map(s => `

function doShare() {
  const r = getCurrentResume(); if (!r) return;
  const email = $('share-email').value.trim().toLowerCase();
  const note = $('share-note').value.trim();
  if (!email) return alert('Email required');
  state.shares.push({ id: generateId(), resume_id: r.id, resume_title: r.title, shared_by: state.user?.name || 'Anonymous', shared_by_email: state.user?.email || '', shared_with: email, note, shared_at: new Date().toISOString() });
  saveShares();
  closeModal();
}
function revokeShare(id) {
  state.shares = state.shares.filter(s => s.id !== id);
  saveShares();
  closeModal();
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function showAnalytics(resumeId) {
  const r = state.resumes.find(x => x.id === resumeId); if (!r) return;
  const data = state.analytics[resumeId] || { views: [] };
  const total = data.views.length;
  const last30 = data.views.filter(v => new Date(v.at) >= new Date(Date.now() - 30*86400000)).length;
  // last 14 days bars
  const byDay = {};
  for (let i = 13; i >= 0; i--) { const d = new Date(Date.now() - i*86400000).toISOString().slice(0,10); byDay[d] = 0; }
  data.views.forEach(v => { const d = v.at.slice(0,10); if (d in byDay) byDay[d]++; });
  const days = Object.keys(byDay); const max = Math.max(1, ...Object.values(byDay));

  openModal(`
    <h3>${t('analytics')} — ${esc(r.title)}</h3>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">${t('totalViews')}</div></div>
      <div class="stat-card"><div class="stat-value">${last30}</div><div class="stat-label">${t('last30')}</div></div>
    </div>
    <h4>${t('last14')}</h4>
    <div class="bar-chart">
      ${days.map(d => `<div class="bar" style="height:${(byDay[d]/max)*100}%"><span class="bar-label">${byDay[d]}</span></div>`).join('')}
    </div>
    <div class="mt-3"><button class="secondary" onclick="closeModal()">${t('close')}</button></div>
  `);
}
